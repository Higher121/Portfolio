<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

    <div class="container">

        <h1>My To Do List</h1>

        <section class="mainList">

            <div class="addList">
                <input id="input" type="text" placeholder="Please Type Here...">
                <button id="add">✔️</button>
            </div>

            <div class="showList">
                <ol class="list">

                    <li>
                        <span class="task-text">Sample Work 1</span>
                        <button class="finished">✔️</button>
                        <button class="remove">❌</button>
                    </li>

                    <li>
                        <span class="task-text">Sample Work 2</span>
                        <button class="finished">✔️</button>
                        <button class="remove">❌</button>
                    </li>

                </ol>
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
